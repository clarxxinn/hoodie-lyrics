<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoodie - Kinetic Lyric Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/hoodie.css">

</head>
<body>

<div id="viewport">
  <div id="speed-badge">SPEED: 1.0x</div>
  <div id="black-curtain"></div>
  <div id="camera">
    <div id="rows-container">
      <div class="file-tab-card">
        <div class="file-tab">
          <img class="html-icon" src="assets/html5.png" alt="HTML5" width="15" height="15">
          <span class="tab-title">hoodie.html</span>
        </div>
        <span class="tab-separator">|</span>
        <div class="file-tab">
          <img class="css-icon" src="assets/css3.png" alt="CSS3" width="15" height="15">
          <span class="tab-title">hoodie.css</span>
        </div>
        <span class="tab-separator">|</span>
        <div class="file-tab">
          <img class="js-icon" src="assets/js.png" alt="JavaScript" width="15" height="15">
          <span class="tab-title">hoodie.js</span>
        </div>
        <span class="tab-separator">|</span>
        <div class="file-tab">
          <img class="mp3-icon" src="assets/mp3.png" alt="MP3" width="15" height="15">
          <span class="tab-title">hoodie.mp3</span>
        </div>
        <span class="tab-close">×</span>
      </div>
    </div>
  </div>
</div>

<script src="js/hoodie.js" defer></script>
</body>
</html>
